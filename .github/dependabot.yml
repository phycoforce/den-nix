version: 2
updates:
  # No nix ecosystem here on purpose: it can only offer a weekly
  # all-or-nothing group with no attribution and no security advisories, while
  # .github/workflows/flake-update.yml gates inputs individually.

  # Bumps the SHA pins and their trailing `# vN` comments. The cooldown delays
  # brand-new tags so a compromised or rushed release can be caught first.
  # Merging the weekly PR stays a manual click after CI: an automerge workflow
  # would merge with GITHUB_TOKEN before its own gate finishes, and main has
  # no branch protection to backstop it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 7
