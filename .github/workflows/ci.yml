name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let main runs finish: they warm caches / produce the authoritative build.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Check formatting
        run: git ls-files -z '*.nix' | xargs -0 nix --accept-flake-config fmt -- --check
      - name: Lint (statix, deadnix, actionlint, editorconfig, typos, zizmor)
        run: nix build .#checks.x86_64-linux.pre-commit -L --accept-flake-config

  generated:
    name: generated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate flake.nix
        run: nix --accept-flake-config run .#write-flake
      - name: Check generated flake.nix is in sync
        run: git diff --exit-code flake.nix

  eval:
    name: eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Flake.lock health
        uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          fail-mode: true
      - name: Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          diagnostic-endpoint: ""
          use-flakehub: false
      - name: Flake check
        run: nix flake check --accept-flake-config
      # Ordinary PRs only: elsewhere the real `build` job subsumes this.
      - name: Dry-run host build
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/')
        run: nix build .#nixosConfigurations.temperantia.config.system.build.toplevel --dry-run --accept-flake-config

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Real build only where a cache miss / breakage can appear; ordinary PRs
    # keep the eval job's dry-run instead.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'dependabot/'))
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # Keep swap (OOM insurance for a cold from-source kernel link) and
          # the tool cache; reclaim the big SDK/runtime directories.
          tool-cache: false
          swap-storage: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # ~95% substituter fetch, not compile: network-bound, so raise
          # download concurrency.
          extra_nix_config: |
            http-connections = 50
            max-substitution-jobs = 32
      # Trusted main builds only (PRs skip). Lock bumps never reach here:
      # GitHub suppresses workflow runs for GITHUB_TOKEN pushes, so
      # flake-update.yml warms those itself. cachix-action pushes via a
      # post-build-hook, so only paths BUILT here go up -> under the 5GB tier.
      - name: Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: phycoforce
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      # No magic-nix-cache: multi-GB closure vs a 10GB-capped Actions cache
      # that rate-limits on a build this size; the substituters serve it.
      - name: Build host toplevel (real build)
        run: nix build .#nixosConfigurations.temperantia.config.system.build.toplevel --accept-flake-config --print-build-logs --no-link

  # Branch protection gate: `build` is skipped on ordinary PRs, so require
  # THIS job instead - it is the only always-present status check.
  CI:
    name: CI
    needs: [lint, generated, eval, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: echo "All required checks passed."
